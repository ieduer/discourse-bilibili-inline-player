enabled:
  default: true
  type: bool
  description: Enable this supplemental preview suite for formats and providers that Discourse does not preview natively.

autoplay_on_click:
  default: true
  type: bool
  description: Request playback after the user clicks the cover card. Bilibili video and bangumi players explicitly use autoplay=0 when disabled.

auto_expand_embeds:
  default: true
  type: bool
  description: Show eligible inline players and readers immediately. Bilibili always requires a click before loading its player. Other automatic media embeds use non-autoplay URLs where available; disable to restore click-to-expand cards.

max_embeds_per_post:
  default: 4
  type: integer
  min: 1
  max: 20
  description: Maximum number of supported media URLs to enhance in one cooked post.

enable_ebook_reader:
  default: true
  type: bool
  description: Render EPUB, MOBI, and AZW3 attachments in the browser. PDF remains owned by Discourse's official PDF Previews component.

max_ebook_size_mb:
  default: 50
  type: integer
  min: 1
  max: 100
  description: Maximum ebook size to load into the inline browser reader. Larger files keep their download fallback.

ebook_reader_height:
  default: 680
  type: integer
  min: 360
  max: 1000
  description: Desktop inline ebook reader height in pixels; mobile uses a viewport-relative height.

enable_office_preview:
  default: true
  type: bool
  description: Show a preview card for uploaded DOCX, XLSX, XLS, and PPTX attachments. Files load only after a reader clicks Preview, are parsed in the reader's browser, and are never sent to a third party. Legacy DOC/PPT and macro-enabled files are labelled unsupported. Disable to leave Office attachments as plain links.

office_preview_max_size_mb:
  default: 20
  type: integer
  min: 1
  max: 50
  description: Largest Office attachment, in MiB, that the in-browser preview downloads. Larger files keep their download link. Decompressed content is limited separately inside the preview worker.

office_preview_timeout_seconds:
  default: 45
  type: integer
  min: 10
  max: 120
  description: Time limit for downloading and parsing one Office attachment. The parser runs in a Web Worker that is terminated when the limit is reached or the reader cancels.

office_preview_height:
  default: 640
  type: integer
  min: 360
  max: 1200
  description: Height in pixels of an open Office preview inside a post; phones use at most 70% of the screen height. Full-screen reading mode uses the whole window.

office_preview_trusted_origins:
  default: ""
  type: list
  list_type: simple
  description: Extra HTTPS origins (for example https://files.example.com) that may serve or redirect Office attachments for in-browser preview. The forum's own origin and the upload CDN and bucket announced by Discourse are always trusted; nothing else is fetched.

office_external_viewer:
  default: disabled
  type: enum
  choices:
    - disabled
    - microsoft
  description: "Optional external viewer. 'microsoft' offers readers a separate, explicitly confirmed action that sends the attachment's URL to Microsoft's Office Online viewer, whose servers then download the file. Only attachments under the public URL prefixes below, in public categories of a site without login_required or secure_uploads, are eligible; private messages and protected uploads never are."

office_external_viewer_url_prefixes:
  default: ""
  type: list
  list_type: simple
  description: HTTPS URL prefixes ending in / (for example https://forum.example.com/uploads/short-url/) whose attachments an administrator certifies as publicly downloadable without login. Required before the external viewer is offered for any attachment. Leave empty to keep every Office preview inside the reader's browser.

show_open_link:
  default: true
  type: bool
  description: Show a fallback link to the original source page under the embed.

enable_experimental_live_embed:
  default: true
  type: bool
  description: Inline bilibili live rooms with bilibili's official activity player iframe and control UI. Disable this only if your site or browser environment has compatibility issues.

enable_live_danmaku:
  default: true
  type: bool
  description: When live embeds are enabled, request danmaku in the live H5 player.

enable_xiaohongshu_inline_page:
  default: true
  type: bool
  description: Automatically expand the official Xiaohongshu or RedNote note page in a lazy-loaded iframe. Disable to keep content-rich cards with an external source link only.

enable_expand_reader:
  default: false
  type: bool
  description: Expand the full text of sources that refuse to be framed or read by the browser (marxists.org documents, and the providers enabled below) through the reader service you configure in expand_reader_endpoint. Off by default; nothing is requested until both this switch and the endpoint are set. Unavailable or failed requests keep link-only source cards.

enable_short_link_resolution:
  default: false
  type: bool
  description: Resolve opaque b23.tv, bili2233.cn, and 163cn.tv share links through the /resolve path of your configured reader service. Independent of enable_expand_reader; requires expand_reader_endpoint. Off by default.

enable_zhihu_summary:
  default: false
  type: bool
  description: Show a bounded summary for exact Zhihu question, answer, or article links through your configured reader service (requires enable_expand_reader and expand_reader_endpoint). Off by default; disabled links stay source cards.

enable_rdfz_blog_inline:
  default: false
  type: bool
  description: Expand rdfz.net student blog articles (<handle>.rdfz.net/p/<slug>) through your configured reader service (requires enable_expand_reader and expand_reader_endpoint). That platform refuses framing and cross-origin reads, so without a reader service these stay link-only source cards. Off by default.

enable_rdfz_blog_comments:
  default: true
  type: bool
  description: Show the replies published under a student blog article beneath its expanded text. Disable to expand the article only. The reply form itself always stays on the blog.

rdfz_blog_comments_height:
  default: 360
  type: integer
  min: 160
  max: 900
  description: Height in pixels of the reply list under an expanded student blog article before the replies scroll on their own. The replies always sit beside the article's scroll box, never inside it.

enable_wechat_inline:
  default: false
  type: bool
  description: Convert supported mp.weixin.qq.com article links through the archive service you configure in wechat_ingest_endpoint and wechat_archive_origin, and show the archived full text inline. Off by default. The original WeChat link remains available on every success or failure.

enable_bdfz_posts_inline:
  default: true
  type: bool
  description: Show exact bdfz.net/posts/<article>/ pages inline by default in an isolated sandboxed frame, with explicit collapse and expand controls plus a permanent original link.

enable_bdfz_post_auto_scale:
  default: true
  type: bool
  description: Automatically fit BDFZ post pages to the available forum width while preserving a readable minimum scale. Disable to render the embedded page at its original 100% scale.

bdfz_post_embed_height:
  default: 900
  type: integer
  min: 480
  max: 1600
  description: Desktop height in pixels of the default-open bdfz.net article frame; mobile uses a viewport-relative height.

enable_x_inline_embed:
  default: true
  type: bool
  description: Show x.com and twitter.com posts inline with X's own official embed player. Disable to keep link-only source cards.

x_embed_height:
  default: 420
  type: integer
  min: 240
  max: 1200
  description: Initial height in pixels of an inline X post. X's player reports the post's own height once it renders and the frame then follows that report, so this value only applies until the report arrives.

x_embed_max_height:
  default: 6000
  type: integer
  min: 600
  max: 12000
  description: Ceiling in pixels for the height an inline X post may grow to from X's own size reports. A post taller than this scrolls inside the card.

enable_instagram_inline_embed:
  default: true
  type: bool
  description: Show instagram.com posts and reels inline with Instagram's embed player. Disable to keep link-only source cards.

instagram_embed_captioned:
  default: true
  type: bool
  description: Use Instagram's captioned embed, which shows the post's caption below the media (the variant Instagram's own share dialog produces). Disable to embed the media only.

instagram_embed_height:
  default: 640
  type: integer
  min: 400
  max: 1200
  description: Initial height in pixels of an inline Instagram post. Instagram's embed page reports its rendered height and the frame then follows that report, so this value only applies until the report arrives.

instagram_embed_max_height:
  default: 4000
  type: integer
  min: 600
  max: 12000
  description: Ceiling in pixels for the height an inline Instagram post may grow to from Instagram's own size reports. A post taller than this scrolls inside the card.

wechat_ingest_endpoint:
  default: ""
  type: string
  description: HTTPS ingestion endpoint of a WeChat archive service you operate (for example https://archive.example.com/api/ingest). Empty means unavailable; there is no built-in service. The service must admit this forum's readers through its own authorization policy.

wechat_archive_origin:
  default: ""
  type: string
  description: HTTPS origin, without a path, that serves your archived WeChat articles (for example https://archive.example.com). A conversion result is shown only when its URL is exactly <this origin>/<slug>; any other returned URL is rejected. Required together with wechat_ingest_endpoint.

wechat_embed_height:
  default: 720
  type: integer
  min: 360
  max: 1400
  description: Height in pixels of the inline archived WeChat full text before the embedded article scrolls internally.

expand_reader_endpoint:
  default: ""
  type: string
  description: HTTPS endpoint of a reader service you operate (for example https://reader.example.com/read). It is called with the linked page URL and returns a reading fragment that this component sanitizes again. Empty means unavailable; there is no built-in service.

expand_reader_height:
  default: 560
  type: integer
  min: 240
  max: 1200
  description: Height in pixels of the expanded reading pane before it scrolls internally.

enable_marxists_inline_media:
  default: true
  type: bool
  description: Play audio and video files hosted on marxists.org inline with the browser's own media element. Document text is handled separately by the expand-reader settings.

auto_open_on_high_risk_env:
  default: true
  type: bool
  description: In high-risk environments such as in-app browsers and WebViews, skip third-party iframe playback and prefer opening bilibili directly.

button_label:
  default: "点击播放"
  type: string
  description: Label shown on the cover button before the iframe is loaded.
