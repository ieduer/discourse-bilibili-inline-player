enabled:
  default: true
  type: bool
  description: Enable this supplemental preview suite for formats and providers that Discourse does not preview natively.

autoplay_on_click:
  default: true
  type: bool
  description: Add autoplay=1 when the user clicks the cover card.

auto_expand_embeds:
  default: true
  type: bool
  description: Show every safe inline player or reader immediately. Automatic expansion always uses a non-autoplay media URL; disable to restore click-to-expand cards.

max_embeds_per_post:
  default: 4
  type: integer
  min: 1
  max: 20
  description: Maximum number of supported media URLs to enhance in one cooked post.

enable_ebook_reader:
  default: true
  type: bool
  description: Render EPUB, MOBI, and AZW3 attachments in the browser. PDF remains owned by Discourse's official PDF Previews component.

max_ebook_size_mb:
  default: 50
  type: integer
  min: 1
  max: 100
  description: Maximum ebook size to load into the inline browser reader. Larger files keep their download fallback.

ebook_reader_height:
  default: 680
  type: integer
  min: 360
  max: 1000
  description: Desktop inline ebook reader height in pixels; mobile uses a viewport-relative height.

show_open_link:
  default: true
  type: bool
  description: Show a fallback link to the original source page under the embed.

enable_experimental_live_embed:
  default: true
  type: bool
  description: Inline bilibili live rooms with bilibili's official activity player iframe and control UI. Disable this only if your site or browser environment has compatibility issues.

enable_live_danmaku:
  default: true
  type: bool
  description: When live embeds are enabled, request danmaku in the live H5 player.

enable_xiaohongshu_inline_page:
  default: true
  type: bool
  description: Automatically expand the official Xiaohongshu or RedNote note page in a lazy-loaded iframe. Disable to keep content-rich cards with an external source link only.

enable_expand_reader:
  default: true
  type: bool
  description: Expand the full text of sources that refuse to be framed or read by the browser, using the shared BDFZ expand-reader service. Disable to fall back to link-only source cards.

enable_short_link_resolution:
  default: false
  type: bool
  description: Resolve opaque b23.tv and bili2233.cn video share links through the configured expand-reader service. Disabled by default as an independent fail-open circuit breaker.

enable_zhihu_summary:
  default: true
  type: bool
  description: Read an exact question, answer, or article match from Zhihu's official search API through expand-reader and show only its bounded summary. Disable to keep link-only source cards.

enable_wechat_inline:
  default: true
  type: bool
  description: Convert supported mp.weixin.qq.com article links through wx.bdfz.net and show the archived full text inline by default. The original WeChat link remains available on every success or failure.

enable_bdfz_posts_inline:
  default: true
  type: bool
  description: Show exact bdfz.net/posts/<article>/ pages inline by default in a script-free frame, with explicit collapse and expand controls plus a permanent original link.

enable_bdfz_post_auto_scale:
  default: true
  type: bool
  description: Automatically fit BDFZ post pages to the available forum width while preserving a readable minimum scale. Disable to render the embedded page at its original 100% scale.

bdfz_post_embed_height:
  default: 900
  type: integer
  min: 480
  max: 1600
  description: Desktop height in pixels of the default-open bdfz.net article frame; mobile uses a viewport-relative height.

wechat_ingest_endpoint:
  default: "https://wx.bdfz.net/api/ingest"
  type: string
  description: Exact HTTPS ingestion endpoint for the operator-owned WeChat archive. For safety this component accepts only https://wx.bdfz.net/api/ingest.

wechat_embed_height:
  default: 720
  type: integer
  min: 360
  max: 1400
  description: Height in pixels of the inline wx.bdfz.net full-text archive before the embedded article scrolls internally.

expand_reader_endpoint:
  default: "https://reader.bdfz.net/read"
  type: string
  description: HTTPS endpoint of the shared expand-reader service. Must be a service you operate; it is called with the linked page URL and returns an already-sanitized reading fragment.

expand_reader_height:
  default: 560
  type: integer
  min: 240
  max: 1200
  description: Height in pixels of the expanded reading pane before it scrolls internally.

enable_marxists_inline_media:
  default: true
  type: bool
  description: Play audio and video files hosted on marxists.org inline with the browser's own media element. Document text is handled separately by the expand-reader settings.

auto_open_on_high_risk_env:
  default: true
  type: bool
  description: In high-risk environments such as in-app browsers and WebViews, skip third-party iframe playback and prefer opening bilibili directly.

button_label:
  default: "点击播放"
  type: string
  description: Label shown on the cover button before the iframe is loaded.
