name: validate

on:
  push:
  pull_request:

jobs:
  theme-component-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate about.json
        run: jq . about.json > /dev/null

      - name: Validate settings.yml
        run: ruby -e 'require "yaml"; YAML.load_file("settings.yml")'

      - name: Check JavaScript syntax
        run: node --check javascripts/discourse/api-initializers/init-bilibili-inline-player.js

      - name: Test supported URL parsers
        run: npm test

      - name: Verify pinned ebook reader boundary
        run: |
          echo "465114ea6de8f7c75c965f35b73e823d8980522a5b632dabcfd37782579720c6  assets/vendor/foliate-reader.min.js" | sha256sum -c -
          if grep -E "makePDF|pdf\\.mjs|application/pdf" assets/vendor/foliate-reader.min.js; then
            echo "Unexpected PDF adapter found in ebook reader bundle" >&2
            exit 1
          fi
